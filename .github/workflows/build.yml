name: Build MRT1 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME 2>/dev/null || echo "No SDK folder"

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Find APKs
        run: find . -name "*.apk" -type f

      - name: Sign APK
        run: |
          APK=$(find . -name "app-release-unsigned.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 0
          fi
          echo "Signing: $APK"
          
          keytool -genkeypair -v \
            -keystore mrt1.keystore \
            -storepass android -keypass android \
            -alias mrt1 -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=MRT1,O=MRT,C=IR"
          
          APKSIGNER=$(find /usr/local/lib/android -name apksigner -type f 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found, trying zipalign + jarsigner"
            ZIPALIGN=$(find /usr/local/lib/android -name zipalign -type f 2>/dev/null | head -1)
            $ZIPALIGN -v 4 "$APK" "signed.apk" || cp "$APK" signed.apk
            mv signed.apk "$APK"
            jarsigner -keystore mrt1.keystore -storepass android -keypass android "$APK" mrt1
          else
            echo "Using: $APKSIGNER"
            $APKSIGNER sign \
              --ks mrt1.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias mrt1 \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              "$APK"
            $APKSIGNER verify "$APK" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MRT1-APK
          path: '**/*.apk'
          if-no-files-found: warn
